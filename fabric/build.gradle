plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def cobblemonFabricJarPath = findProperty("local_cobblemon_fabric_jar") ?: System.getenv("COBBLEMON_FABRIC_JAR")
def localCobblemonFabricJar = cobblemonFabricJarPath == null ? null : file(cobblemonFabricJarPath)

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version"
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    modLocalRuntime "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    // Loom does not expose Cobblemon's nested language adapter in every dev run;
    // keep it explicit for local runtime without adding it to the published mod metadata.
    modLocalRuntime "net.fabricmc:fabric-language-kotlin:$rootProject.fabric_language_kotlin_version"

    if (localCobblemonFabricJar != null && localCobblemonFabricJar.exists()) {
        modImplementation files(localCobblemonFabricJar)
    } else {
        modImplementation "curse.maven:cobblemon-687131:$rootProject.cobblemon_fabric_curse_id"
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'cobblemonVersion', rootProject.cobblemon_version
    inputs.property 'clothConfigVersion', rootProject.cloth_config_version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version,
                cobblemonVersion: inputs.properties.cobblemonVersion,
                clothConfigVersion: inputs.properties.clothConfigVersion
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
