plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    main {
        java {
            exclude 'net/levelscraft7/rustlingspots/config/**'
            exclude 'net/levelscraft7/rustlingspots/network/packet/**'
            exclude 'net/levelscraft7/rustlingspots/spot/BiomeGroup.java'
            exclude 'net/levelscraft7/rustlingspots/spot/LootPoolService.java'
            exclude 'net/levelscraft7/rustlingspots/spot/PokemonPoolService.java'
            exclude 'net/levelscraft7/rustlingspots/spot/RustlingMessages.java'
            exclude 'net/levelscraft7/rustlingspots/spot/RustlingSpot.java'
            exclude 'net/levelscraft7/rustlingspots/spot/RustlingSpotFamily.java'
            exclude 'net/levelscraft7/rustlingspots/spot/RustlingSpotFamilyConfigService.java'
            exclude 'net/levelscraft7/rustlingspots/spot/RustlingSpotManager.java'
            exclude 'net/levelscraft7/rustlingspots/spot/RustlingSpotService.java'
            exclude 'net/levelscraft7/rustlingspots/spot/SpotInteractionBlocker.java'
            exclude 'net/levelscraft7/rustlingspots/spot/SpotRewardResolver.java'
            exclude 'net/levelscraft7/rustlingspots/spot/SpotSpawner.java'
            exclude 'net/levelscraft7/rustlingspots/spot/SpotTicker.java'
        }
        resources {
            exclude 'assets/**'
            exclude 'pack.mcmeta'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

def cobblemonNeoForgeJarPath = findProperty("local_cobblemon_neoforge_jar") ?: System.getenv("COBBLEMON_NEOFORGE_JAR")
def localCobblemonNeoForgeJar = cobblemonNeoForgeJarPath == null ? null : file(cobblemonNeoForgeJarPath)

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    if (localCobblemonNeoForgeJar != null && localCobblemonNeoForgeJar.exists()) {
        compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
        modImplementation files(localCobblemonNeoForgeJar)
    } else {
        compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
        modImplementation "curse.maven:cobblemon-687131:$rootProject.cobblemon_neoforge_curse_id"
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'cobblemonVersion', rootProject.cobblemon_version
    inputs.property 'clothConfigVersion', rootProject.cloth_config_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version,
                cobblemonVersion: inputs.properties.cobblemonVersion,
                clothConfigVersion: inputs.properties.clothConfigVersion
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
