architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets {
    main {
        java {
            exclude 'net/levelscraft7/rustlingspots/RustlingSpotsFabricMod.java'
            exclude 'net/levelscraft7/rustlingspots/network/RustlingSpotsNetwork.java'
            exclude 'net/levelscraft7/rustlingspots/registry/**'
        }
        resources {
            exclude 'rustlingspots.mixins.json'
        }
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

def cobblemonNeoForgeJarPath = findProperty("local_cobblemon_neoforge_jar") ?: System.getenv("COBBLEMON_NEOFORGE_JAR")
def localCobblemonNeoForgeJar = cobblemonNeoForgeJarPath == null ? null : file(cobblemonNeoForgeJarPath)

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modCompileOnly "me.shedaniel.cloth:cloth-config:$rootProject.cloth_config_version"

    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    if (localCobblemonNeoForgeJar != null && localCobblemonNeoForgeJar.exists()) {
        compileOnly files(localCobblemonNeoForgeJar)
    } else {
        modCompileOnly "curse.maven:cobblemon-687131:$rootProject.cobblemon_neoforge_curse_id"
    }
}
